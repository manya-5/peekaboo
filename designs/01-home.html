<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peekaboo · Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#E9E6DF}
a{color:#4A72B0}a:hover{color:#365A93}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F5EE; color: #2B2B2B; font-family: 'Outfit', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 26px 22px 0 22px; display: flex; flex-direction: column; align-items: center; gap: 2px">
    <h1 aria-label="Peekaboo" style="margin: 0; display: flex; align-items: flex-end; font-weight: 600; font-size: 42px; line-height: 1; letter-spacing: -0.035em; color: #5F8BC9">
      <span aria-hidden="true">Peekab</span>
      <span aria-hidden="true" style="display: flex; gap: 1px; margin: 0 0 8px 1px">
        <span style="width: 21px; height: 25px; border-radius: 50%; background: #FFFFFF; border: 3px solid #5F8BC9; box-sizing: border-box; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 2px 2px 0"><span style="width: 8px; height: 11px; border-radius: 50%; background: #2B3A55; display: block"></span></span>
        <span style="width: 21px; height: 25px; border-radius: 50%; background: #FFFFFF; border: 3px solid #5F8BC9; box-sizing: border-box; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 2px 2px 0"><span style="width: 8px; height: 11px; border-radius: 50%; background: #2B3A55; display: block"></span></span>
      </span>
    </h1>
    <div style="font-size: 13px; font-weight: 400; color: #6E6A62; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px">Thu · Oct 22</div>
  </header>

  <section aria-label="Today's spot" style="position: relative; margin: 24px 22px 0 22px; border: 1.5px dashed #5F8BC9; border-radius: 28px; padding: 20px 18px 10px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 14px; font-weight: 500; color: #4A72B0">Psst, Manya</div>
      <div style="font-size: 34px; font-weight: 500; line-height: 1; letter-spacing: -0.03em; color: #2B2B2B">Find a long shadow</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 400; color: #6E6A62">
        <span>Now, 3:12</span><span>Best light, 4 to 6</span>
      </div>
      <div role="img" aria-label="Best light for long shadows is from 4 to 6 pm; it is 3:12 now" style="position: relative; height: 8px; border-radius: 999px; background: #ECE5D8">
        <span style="position: absolute; left: 40%; width: 40%; top: 0; bottom: 0; border-radius: 999px; background: #F7C948; display: block"></span>
        <span style="position: absolute; left: 24%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #4A72B0; border: 3px solid #F8F5EE; box-sizing: content-box; display: block"></span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="display: inline-flex; align-items: center; gap: 6px; border: 1px solid #DCD4C5; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: #3F3B35"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A72B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4v-4h4v-4h4V8h4"/></svg>Sidewalks, stairs</span>
    </div>

    <div style="display: grid; grid-template-columns: 1fr auto auto; gap: 4px; align-items: center">
      <button type="button" style="height: 48px; border: 0; border-radius: 999px; background: #4A72B0; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>I spotted one</button>
      <button type="button" style="border: 0; background: transparent; padding: 12px 8px; font-family: inherit; font-size: 14px; color: #4A72B0; cursor: pointer">Swap</button>
      <button type="button" style="border: 0; background: transparent; padding: 12px 8px; font-family: inherit; font-size: 14px; color: #4A72B0; cursor: pointer">Not today</button>
    </div>
  </section>

  <section aria-label="October, newest first" style="padding: 22px 30px 0 30px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-weight: 500; font-size: 20px; letter-spacing: -0.01em; color: #2B2B2B">October</h2>
      <span style="font-size: 14px; font-weight: 300; color: #6E6A62">15 so far</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 16px; column-gap: 16px; justify-items: center">
      
        
          <div role="img" aria-label="Today, not taken yet" style="width: 88px; height: 88px; border: 1.5px dashed #5F8BC9; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #4A72B0">Today</div>
        
        
      
        
        
          <img src="images/fountain.jpg" alt="October 20, fountain" style="width: 88px; height: 88px; object-fit: cover; border: 6px solid #FFFFFF; box-sizing: border-box; border-radius: 999px 999px 14px 14px; transform: rotate(2deg); box-shadow: 0 4px 10px rgba(70, 60, 40, 0.14); display: block">
        
      
        
        
          <img src="images/bridge-oct19.jpg" alt="October 19, the bridge, in black and white" style="width: 88px; height: 88px; object-fit: cover; border: 6px solid #FFFFFF; box-sizing: border-box; border-radius: 20px; transform: rotate(-2deg); box-shadow: 0 4px 10px rgba(70, 60, 40, 0.14); display: block">
        
      
        
        
          <img src="images/lake.jpg" alt="October 18, lakeside" style="width: 88px; height: 88px; object-fit: cover; border: 6px solid #FFFFFF; box-sizing: border-box; border-radius: 50%; transform: rotate(3deg); box-shadow: 0 4px 10px rgba(70, 60, 40, 0.14); display: block">
        
      
        
        
          <img src="images/mushroom.jpg" alt="October 16, mushroom" style="width: 88px; height: 88px; object-fit: cover; border: 6px solid #FFFFFF; box-sizing: border-box; border-radius: 18px; transform: rotate(-3deg); box-shadow: 0 4px 10px rgba(70, 60, 40, 0.14); display: block">
        
      
        
        
          <img src="images/window.jpg" alt="October 15, window and lamp" style="width: 88px; height: 88px; object-fit: cover; border: 6px solid #FFFFFF; box-sizing: border-box; border-radius: 999px 999px 14px 14px; transform: rotate(1.5deg); box-shadow: 0 4px 10px rgba(70, 60, 40, 0.14); display: block">
        
      
        
        
          <img src="images/bridge-oct13.jpg" alt="October 13, the bridge again" style="width: 88px; height: 88px; object-fit: cover; border: 6px solid #FFFFFF; box-sizing: border-box; border-radius: 50%; transform: rotate(-4deg); box-shadow: 0 4px 10px rgba(70, 60, 40, 0.14); display: block">
        
      
        
        
          <img src="images/tram.jpg" alt="October 12, blue tram" style="width: 88px; height: 88px; object-fit: cover; border: 6px solid #FFFFFF; box-sizing: border-box; border-radius: 20px; transform: rotate(2deg); box-shadow: 0 4px 10px rgba(70, 60, 40, 0.14); display: block">
        
      
        
        
          <img src="images/daisy.jpg" alt="October 11, daisies" style="width: 88px; height: 88px; object-fit: cover; border: 6px solid #FFFFFF; box-sizing: border-box; border-radius: 999px 999px 14px 14px; transform: rotate(-1.5deg); box-shadow: 0 4px 10px rgba(70, 60, 40, 0.14); display: block">
        
      
    </div>
  </section>

  <nav aria-label="Main" style="margin-top: auto; height: 70px; border-top: 1px solid #ECE5D8; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 6px; box-sizing: border-box; align-items: center">
    <button type="button" aria-current="page" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 12px; font-weight: 500; color: #4A72B0; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><ellipse cx="8.5" cy="12" rx="3.6" ry="5.2" fill="#FFFFFF" stroke="#4A72B0" stroke-width="1.5"/><ellipse cx="15.5" cy="12" rx="3.6" ry="5.2" fill="#FFFFFF" stroke="#4A72B0" stroke-width="1.5"/><ellipse cx="8.5" cy="14" rx="1.5" ry="2.1" fill="#2B3A55"/><ellipse cx="15.5" cy="14" rx="1.5" ry="2.1" fill="#2B3A55"/></svg>Today</button>
    <button type="button" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 12px; font-weight: 400; color: #6E6A62; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E6A62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="3.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><path d="M3.5 20.5v-3a3.5 3.5 0 0 1 7 0v3z"/><circle cx="17" cy="17" r="3.5"/></svg>Roll</button>
    <button type="button" aria-label="Take any photo" style="justify-self: center; width: 50px; height: 50px; border: 0; border-radius: 50%; background: #4A72B0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button type="button" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 12px; font-weight: 400; color: #6E6A62; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E6A62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M10 17h4"/></svg>Contests</button>
    <button type="button" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 12px; font-weight: 400; color: #6E6A62; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E6A62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Wraps</button>
  </nav>
</div>
</body>
</html>
