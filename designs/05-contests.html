<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peekaboo · Contests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#E9E6DF}
a{color:#4A72B0}a:hover{color:#365A93}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F5EE; color: #2B2B2B; font-family: 'Outfit', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 34px 22px 0 22px">
    <h1 style="margin: 0; font-weight: 500; font-size: 34px; letter-spacing: -0.02em; line-height: 1.05">Contests</h1>
  </header>

  <section aria-label="Open contests" style="padding: 22px 22px 0 22px; display: flex; flex-direction: column; gap: 12px">
    
      <article style="background: #FFFFFF; border-radius: 22px; padding: 14px 14px 14px 14px; display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center">
        
          <div style="position: relative; display: flex; flex-direction: column; align-items: center">
            <img src="images/bridge-today.jpg" alt="Your photo: the bridge" style="width: 72px; height: 72px; object-fit: cover; border: 4px solid #F8F5EE; box-sizing: border-box; border-radius: 999px 999px 12px 12px; display: block">
            <span style="margin-top: -10px; background: #4A72B0; color: #FFFFFF; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 500; white-space: nowrap">You have this</span>
          </div>
        
        
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <h2 style="margin: 0; font-size: 18px; font-weight: 500; line-height: 1.15">Bridges and arches</h2>
          <span style="font-size: 14px; font-weight: 300; color: #5E5A52">Structures over water</span>
          <span style="font-size: 13px; font-weight: 400; color: #4A72B0">9 days left</span>
        </div>
        <button type="button" style="height: 36px; padding: 0 14px; border: 1.5px solid #4A72B0; border-radius: 999px; background: transparent; color: #4A72B0; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Enter</button>
      </article>
    
      <article style="background: #FFFFFF; border-radius: 22px; padding: 14px 14px 14px 14px; display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center">
        
          <div style="position: relative; display: flex; flex-direction: column; align-items: center">
            <img src="images/mushroom.jpg" alt="Your photo: mushroom" style="width: 72px; height: 72px; object-fit: cover; border: 4px solid #F8F5EE; box-sizing: border-box; border-radius: 50%; display: block">
            <span style="margin-top: -10px; background: #4A72B0; color: #FFFFFF; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 500; white-space: nowrap">You have this</span>
          </div>
        
        
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <h2 style="margin: 0; font-size: 18px; font-weight: 500; line-height: 1.15">Small wonders</h2>
          <span style="font-size: 14px; font-weight: 300; color: #5E5A52">Close-ups of everyday things</span>
          <span style="font-size: 13px; font-weight: 400; color: #4A72B0">3 weeks left</span>
        </div>
        <button type="button" style="height: 36px; padding: 0 14px; border: 1.5px solid #4A72B0; border-radius: 999px; background: transparent; color: #4A72B0; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Enter</button>
      </article>
    
      <article style="background: #FFFFFF; border-radius: 22px; padding: 14px 14px 14px 14px; display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center">
        
          <div style="position: relative; display: flex; flex-direction: column; align-items: center">
            <img src="images/tram.jpg" alt="Your photo: blue tram" style="width: 72px; height: 72px; object-fit: cover; border: 4px solid #F8F5EE; box-sizing: border-box; border-radius: 18px; display: block">
            <span style="margin-top: -10px; background: #4A72B0; color: #FFFFFF; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 500; white-space: nowrap">You have this</span>
          </div>
        
        
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <h2 style="margin: 0; font-size: 18px; font-weight: 500; line-height: 1.15">Street colour</h2>
          <span style="font-size: 14px; font-weight: 300; color: #5E5A52">Colour in the city</span>
          <span style="font-size: 13px; font-weight: 400; color: #4A72B0">4 weeks left</span>
        </div>
        <button type="button" style="height: 36px; padding: 0 14px; border: 1.5px solid #4A72B0; border-radius: 999px; background: transparent; color: #4A72B0; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Enter</button>
      </article>
    
      <article style="background: #FFFFFF; border-radius: 22px; padding: 14px 14px 14px 14px; display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center">
        
        
          <div role="img" aria-label="No photo yet" style="width: 72px; height: 72px; border: 1.5px dashed #5F8BC9; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; justify-self: center">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A72B0" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </div>
        
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <h2 style="margin: 0; font-size: 18px; font-weight: 500; line-height: 1.15">Long light</h2>
          <span style="font-size: 14px; font-weight: 300; color: #5E5A52">Shadows and low sun</span>
          <span style="font-size: 13px; font-weight: 400; color: #4A72B0">5 weeks left</span>
        </div>
        <button type="button" style="height: 36px; padding: 0 14px; border: 1.5px solid #4A72B0; border-radius: 999px; background: transparent; color: #4A72B0; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Shoot</button>
      </article>
    
  </section>

  <nav aria-label="Main" style="margin-top: auto; height: 70px; border-top: 1px solid #ECE5D8; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 6px; box-sizing: border-box; align-items: center">
    <button type="button" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 12px; font-weight: 400; color: #6E6A62; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><ellipse cx="8.5" cy="12" rx="3.6" ry="5.2" fill="#FFFFFF" stroke="#6E6A62" stroke-width="1.5"/><ellipse cx="15.5" cy="12" rx="3.6" ry="5.2" fill="#FFFFFF" stroke="#6E6A62" stroke-width="1.5"/><ellipse cx="8.5" cy="14" rx="1.5" ry="2.1" fill="#6E6A62"/><ellipse cx="15.5" cy="14" rx="1.5" ry="2.1" fill="#6E6A62"/></svg>Today</button>
    <button type="button" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 12px; font-weight: 400; color: #6E6A62; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E6A62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="3.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><path d="M3.5 20.5v-3a3.5 3.5 0 0 1 7 0v3z"/><circle cx="17" cy="17" r="3.5"/></svg>Roll</button>
    <button type="button" aria-label="Take any photo" style="justify-self: center; width: 50px; height: 50px; border: 0; border-radius: 50%; background: #4A72B0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button type="button" aria-current="page" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 12px; font-weight: 500; color: #4A72B0; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4A72B0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M10 17h4"/></svg>Contests</button>
    <button type="button" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 12px; font-weight: 400; color: #6E6A62; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E6A62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Wraps</button>
  </nav>
</div>
</body>
</html>
