<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peekaboo · Boo reacts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#E9E6DF}
a{color:#4A72B0}a:hover{color:#365A93}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F5EE; color: #2B2B2B; font-family: 'Outfit', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden">
  <div style="height: 56px; display: flex; align-items: center; font-size: 14px; font-weight: 300; letter-spacing: 0.02em; color: #6E6A62">October 22 · 4:48 pm</div>

  <section aria-label="Your photo" style="position: relative; margin-top: 34px">
    <div role="img" aria-label="Boo rolling its eyes" style="position: absolute; left: 50%; top: -30px; transform: translateX(-50%); z-index: 2; display: flex; gap: 3px">
      <span style="width: 30px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 2.5px solid #5F8BC9; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; padding-top: 4px"><span style="width: 12px; height: 17px; border-radius: 50%; background: #2B3A55; display: block"></span></span>
      <span style="width: 30px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 2.5px solid #5F8BC9; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; padding-top: 4px"><span style="width: 12px; height: 17px; border-radius: 50%; background: #2B3A55; display: block"></span></span>
    </div>
    <img src="images/bridge-today.jpg" alt="Your photo: the bridge over the water" style="width: 240px; height: 300px; object-fit: cover; border: 9px solid #FFFFFF; box-sizing: border-box; border-radius: 999px 999px 20px 20px; box-shadow: 0 10px 24px rgba(70, 60, 40, 0.14); display: block">
  </section>

  <div style="margin-top: 30px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 0 30px">
    <h1 style="margin: 0; font-size: 34px; font-weight: 500; letter-spacing: -0.03em; line-height: 1">The bridge. Again.</h1>
    <p style="margin: 0; font-size: 17px; font-weight: 300; line-height: 1.35; color: #5E5A52">Fourth time this month. It knows your face by now.</p>
  </div>

  <div aria-label="Your other bridge photos: October 6, 13 and 19" role="group" style="margin-top: 16px; display: flex; align-items: center; gap: 10px">
    <div style="display: flex">
      <img src="images/bridge-oct06.jpg" alt="October 6" style="width: 44px; height: 44px; object-fit: cover; border: 3px solid #FFFFFF; box-sizing: border-box; border-radius: 50%; display: block">
      <img src="images/bridge-oct13.jpg" alt="October 13" style="width: 44px; height: 44px; object-fit: cover; border: 3px solid #FFFFFF; box-sizing: border-box; border-radius: 50%; margin-left: -12px; display: block">
      <img src="images/bridge-oct19.jpg" alt="October 19" style="width: 44px; height: 44px; object-fit: cover; border: 3px solid #FFFFFF; box-sizing: border-box; border-radius: 50%; margin-left: -12px; display: block">
    </div>
    <span style="font-size: 14px; font-weight: 400; color: #6E6A62">Oct 6, 13, 19</span>
  </div>

  <p style="margin: 22px 30px 0 30px; text-align: center; font-size: 17px; font-weight: 400; line-height: 1.35; color: #4A72B0">But the light on the water is lovely.</p>

  <div style="margin-top: auto; width: 100%; padding: 0 22px 30px 22px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button type="button" style="height: 48px; border: 1.5px solid #4A72B0; border-radius: 999px; background: transparent; color: #4A72B0; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer">Retake</button>
    <button type="button" style="height: 48px; border: 0; border-radius: 999px; background: #4A72B0; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer">Keep it</button>
  </div>
</div>
</body>
</html>
