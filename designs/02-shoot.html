<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peekaboo · Shoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#E9E6DF}
a{color:#4A72B0}a:hover{color:#365A93}
</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F8F5EE; color: #2B2B2B; font-family: 'Outfit', system-ui, sans-serif; overflow: hidden">
  <img src="images/bridge-today.jpg" alt="Camera view: a bridge over the water" style="position: absolute; left: 0; top: 0; width: 390px; height: 650px; object-fit: cover; display: block">

  <div style="position: absolute; left: 16px; right: 16px; top: 18px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center">
    <button type="button" aria-label="Close camera" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #F8F5EE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div style="justify-self: center; background: #F8F5EE; color: #2B2B2B; font-size: 15px; font-weight: 500; padding: 9px 16px; border-radius: 999px">Spotting a long shadow</div>
    <button type="button" aria-label="Flash off" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #F8F5EE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg></button>
  </div>

  <section aria-label="Camera controls" style="position: absolute; left: 0; right: 0; bottom: 0; height: 226px; background: #F8F5EE; border-radius: 30px 30px 0 0; display: flex; flex-direction: column; align-items: center">
    <div role="img" aria-label="Boo peeking up at your photo" style="margin-top: -26px; width: 86px; height: 44px; background: #F8F5EE; border-radius: 43px 43px 0 0; display: flex; justify-content: center; gap: 3px; padding-top: 7px; box-sizing: border-box">
      <span style="width: 24px; height: 34px; border-radius: 50%; background: #FFFFFF; border: 2.5px solid #5F8BC9; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; padding-top: 3px"><span style="width: 10px; height: 14px; border-radius: 50%; background: #2B3A55; display: block"></span></span>
      <span style="width: 24px; height: 34px; border-radius: 50%; background: #FFFFFF; border: 2.5px solid #5F8BC9; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; padding-top: 3px"><span style="width: 10px; height: 14px; border-radius: 50%; background: #2B3A55; display: block"></span></span>
    </div>
    <div style="margin-top: 10px; font-size: 16px; font-weight: 400; color: #5E5A52">Go on, I'm watching</div>
    <div style="margin-top: auto; width: 100%; padding: 0 40px 36px 40px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; justify-items: center">
      <button type="button" aria-label="Open your roll" style="width: 50px; height: 50px; border: 4px solid #FFFFFF; border-radius: 50%; padding: 0; overflow: hidden; background: #FFFFFF; box-shadow: 0 3px 8px rgba(70, 60, 40, 0.14); cursor: pointer"><img src="images/fountain.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
      <button type="button" aria-label="Take photo" style="width: 78px; height: 78px; border: 2px solid #4A72B0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><span style="width: 64px; height: 64px; border-radius: 50%; background: #4A72B0; display: block"></span></button>
      <button type="button" style="border: 0; background: transparent; padding: 10px 4px; font-family: inherit; font-size: 14px; color: #4A72B0; cursor: pointer">New spot</button>
    </div>
  </section>
</div>
</body>
</html>
